<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #1e293b; border-radius: 16px; padding: 48px; max-width: 560px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); }
        .badge { display: inline-block; padding: 4px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; text-transform: uppercase; background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        h1 { font-size: 24px; font-weight: 700; margin: 16px 0 4px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .info-item { background: #0f172a; border-radius: 10px; padding: 16px; }
        .info-item .label { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 600; }
        .info-item .value { font-size: 15px; font-weight: 600; margin-top: 4px; word-break: break-all; }
        .footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #334155; font-size: 12px; color: #64748b; display: flex; justify-content: space-between; }
        .commit-hash { font-family: monospace; color: #f59e0b; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">OPERATIONAL</span>
        <h1>My App</h1>
        <p class="subtitle">Automated CI/CD Deployment Pipeline</p>
        <div class="info-grid">
            <div class="info-item"><div class="label">Status</div><div class="value" style="color:#22c55e;">All Systems Go</div></div>
            <div class="info-item"><div class="label">Version</div><div class="value">v1.0.0</div></div>
            <div class="info-item" style="grid-column: 1 / -1;"><div class="label">Commit</div><div class="value commit-hash">__COMMIT_HASH__</div></div>
            <div class="info-item" style="grid-column: 1 / -1;"><div class="label">Deployed At</div><div class="value">__DEPLOY_TIME__</div></div>
        </div>
        <div class="footer"><span>Powered by GitHub Actions</span></div>
    </div>
</body>
</html>
