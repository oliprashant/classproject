name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ secrets.SERVER_USERNAME }}
      PASS: ${{ secrets.SERVER_PASSWORD }}
      PORT: "8027"
      APP_NAME: "prashantoli"
      CONF_NAME: "prshant"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Setup server (idempotent)
        timeout-minutes: 5
        run: |
          set -e

          echo '<VirtualHost *:'"$PORT"'>' > /tmp/$CONF_NAME.conf
          echo '    DocumentRoot /home/'"$USER"'/'"$APP_NAME"'/current' >> /tmp/$CONF_NAME.conf
          echo '    <Directory /home/'"$USER"'/'"$APP_NAME"'/>' >> /tmp/$CONF_NAME.conf
          echo '        Options -Indexes +FollowSymLinks' >> /tmp/$CONF_NAME.conf
          echo '        AllowOverride None' >> /tmp/$CONF_NAME.conf
          echo '        Require all granted' >> /tmp/$CONF_NAME.conf
          echo '    </Directory>' >> /tmp/$CONF_NAME.conf
          echo '    ErrorLog ${APACHE_LOG_DIR}/'"$CONF_NAME"'-error.log' >> /tmp/$CONF_NAME.conf
          echo '    CustomLog ${APACHE_LOG_DIR}/'"$CONF_NAME"'-access.log combined' >> /tmp/$CONF_NAME.conf
          echo '</VirtualHost>' >> /tmp/$CONF_NAME.conf

          sshpass -p "$PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/$CONF_NAME.conf "$USER@$HOST:/tmp/$CONF_NAME.conf"

          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" "
            set -e

            if ! dpkg -s apache2 2>/dev/null | grep -q 'Status: install ok installed'; then
              echo 'Installing Apache...'
              echo '$PASS' | sudo -S apt-get update -qq
              echo '$PASS' | sudo -S apt-get install -y -qq apache2
            fi

            mkdir -p ~/$APP_NAME/{v1,v2}

            echo '$PASS' | sudo -S sh -c 'lsof -ti tcp:$PORT 2>/dev/null | xargs -r sudo kill -9 || true'
            echo '$PASS' | sudo -S sed -i '/^Listen $PORT\$/d' /etc/apache2/ports.conf 2>/dev/null || true
            if ! grep -q 'Listen $PORT' /etc/apache2/ports.conf 2>/dev/null; then
              echo '$PASS' | sudo -S sh -c 'echo \"Listen $PORT\" >> /etc/apache2/ports.conf'
            fi

            echo '$PASS' | sudo -S mv /tmp/$CONF_NAME.conf /etc/apache2/sites-available/$CONF_NAME.conf
            if ! [ -L /etc/apache2/sites-enabled/$CONF_NAME.conf ]; then
              echo '$PASS' | sudo -S a2ensite $CONF_NAME.conf
            fi

            echo '$PASS' | sudo -S chmod 755 /home/\$USER/
            echo '$PASS' | sudo -S chown -R \$USER:www-data ~/$APP_NAME/

            echo '$PASS' | sudo -S apache2ctl configtest
            echo '$PASS' | sudo -S apache2ctl graceful
          "

      - name: Blue-Green Deploy
        timeout-minutes: 8
        run: |
          set -e

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          echo "=== Testing SSH connection ==="
          timeout 30 sshpass -p "$PASS" ssh $SSH_OPTS "$USER@$HOST" "echo 'SSH connection OK'"

          echo "=== Determining inactive version (blue-green) ==="
          INACTIVE=$(timeout 30 sshpass -p "$PASS" ssh $SSH_OPTS "$USER@$HOST" 'APP_DIR=/home/'"$USER"'/'"$APP_NAME"'; if [ -L "$APP_DIR/current" ] && [ "$(readlink "$APP_DIR/current")" = "$APP_DIR/v2" ]; then echo v1; else echo v2; fi')
          echo "Target version: $INACTIVE"

          echo "=== Cleaning inactive slot ==="
          timeout 60 sshpass -p "$PASS" ssh $SSH_OPTS "$USER@$HOST" "rm -rf /home/$USER/$APP_NAME/$INACTIVE/* /home/$USER/$APP_NAME/$INACTIVE/.[!.]* 2>/dev/null || true"

          echo "=== Packing static export (dist/) ==="
          tar -czf /tmp/deploy.tar.gz -C dist .
          echo "Tarball size: $(du -sh /tmp/deploy.tar.gz | cut -f1), files: $(find dist -type f | wc -l)"

          echo "=== Uploading tarball via scp (with retries) ==="
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            if timeout 240 sshpass -p "$PASS" scp $SSH_OPTS /tmp/deploy.tar.gz "$USER@$HOST:/tmp/deploy.tar.gz"; then
              echo "Upload OK"
              break
            fi
            echo "Upload failed, retrying..."
            sleep 5
            if [ "$attempt" = "3" ]; then
              echo "Upload failed after 3 attempts"; exit 1
            fi
          done

          echo "=== Extracting on server ==="
          timeout 90 sshpass -p "$PASS" ssh $SSH_OPTS "$USER@$HOST" "tar -xzf /tmp/deploy.tar.gz -C /home/$USER/$APP_NAME/$INACTIVE/ && rm -f /tmp/deploy.tar.gz"

          echo "=== Atomic symlink swap + graceful Apache reload ==="
          DEPLOY_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          timeout 60 sshpass -p "$PASS" ssh $SSH_OPTS "$USER@$HOST" "APP_DIR=/home/$USER/$APP_NAME; ln -sfn \$APP_DIR/$INACTIVE \$APP_DIR/current; echo '$DEPLOY_TIME - deployed $INACTIVE' >> \$APP_DIR/deploy.log; echo '$PASS' | sudo -S apache2ctl graceful"

      - name: Verify deployment
        timeout-minutes: 3
        run: |
          set -e
          echo "=== Verifying deployment on port $PORT (via SSH to avoid external firewall) ==="
          sleep 2

          RESULT=$(sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 "$USER@$HOST" "curl -sS -o /tmp/_verify_body -w '%{http_code}' --connect-timeout 10 --max-time 20 --retry 3 --retry-delay 2 --retry-connrefused http://127.0.0.1:$PORT/ && echo && grep -o '<title>[^<]*</title>' /tmp/_verify_body || true")

          echo "Server response:"
          echo "$RESULT"

          HTTP_CODE=$(echo "$RESULT" | head -n1 | tr -d '[:space:]')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deployment verification failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Deployment verified - site is live on http://$HOST:$PORT"